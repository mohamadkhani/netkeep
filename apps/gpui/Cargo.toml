[package]
name = "logiguard-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = "0.2"
gpui-component = "0.5"
anyhow = "1"
core-types = { path = "../../crates/core-types" }
control-api = { path = "../../crates/control-api" }
serde_json = "1"
tray-icon = "0.24.0"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon/muda need GTK initialized on Linux before Menu::new / TrayIconBuilder.
gtk = "0.18"
