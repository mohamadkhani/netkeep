[package]
name = "logiguard-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
core-types = { path = "../../crates/core-types" }
control-api = { path = "../../crates/control-api" }
serde_json = "1"
tray-icon = "0.24.0"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon/muda need GTK initialized on Linux before Menu::new / TrayIconBuilder.
gtk = "0.18"
