[package]
name = "logiguard-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
control-api = { path = "../../crates/control-api" }
control-service = { path = "../../crates/control-service" }
core-types = { path = "../../crates/core-types" }
decision-engine = { path = "../../crates/decision-engine" }
enforcer = { path = "../../crates/enforcer" }
flow-classifier = { path = "../../crates/flow-classifier" }
proxy-client = { path = "../../crates/proxy-client" }
serde_json = "1"
state-store = { path = "../../crates/state-store" }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tokio = { version = "1", features = ["sync"] }

libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
hickory-resolver = "0.24"
rusqlite = "0.32"
